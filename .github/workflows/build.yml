name: Build and test
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  dependency-resolver-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Test dependency selection and restoration without network access
        run: python -m unittest discover -s tests/dependencies -p 'test_*.py' -v

  resolve-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install current stable build tools
        run: python -m pip install --upgrade cmake ninja jinja2 jsonschema
      # Resolve once for this workflow. Every compiler consumes this exact source set,
      # including Mbed TLS's matching framework revision, even if upstream moves later.
      - name: Resolve and fetch latest stable backend and codec sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cmake -P scripts/init-dependencies.cmake
      - name: Save the shared dependency resolution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-resolution
          path: out/dependency-resolution.json
          if-no-files-found: error

  core:
    needs: resolve-dependencies
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - os: ubuntu-24.04
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            cxxflags: -stdlib=libc++ -fexperimental-library
          - os: macos-latest
            compiler: apple-clang
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install current stable build tools
        run: python -m pip install --upgrade cmake ninja jinja2 jsonschema
      - uses: actions/download-artifact@v8
        with:
          name: dependency-resolution
          path: out
      # Clang 18 has __cpp_concepts=201907L, so libstdc++'s expected gate rejects it.
      # libc++ 18 provides expected without redefining compiler feature macros.
      # Its stop_token/jthread implementation also requires -fexperimental-library.
      - name: Install the Clang C++ standard library
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libc++-18-dev libc++abi-18-dev
      - name: Restore the shared backend and codec source revisions
        run: cmake -DANANARCHIVER_DEPENDENCY_RESTORE=ON -P scripts/init-dependencies.cmake
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Invoke-Msvc.ps1 cmake --preset core-release
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Invoke-Msvc.ps1 cmake --build --preset core-release
      - name: Configure Unix
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: cmake --preset core-release
      - name: Build Unix
        if: runner.os != 'Windows'
        run: cmake --build --preset core-release
      - name: Test
        run: ctest --preset core-release
      - name: Save build provenance and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-info-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            out/dependency-resolution.json
            out/build/core-release/build-info.json
            out/build/core-release/application/build-info.json
            out/build/core-release/**/dependency-build.json
            out/build/core-release/**/build-trace-config.json
            out/build/core-release/**/Testing/Temporary/*.log
            out/build/core-release/*-prefix/src/*-stamp/*.log
          if-no-files-found: warn

  sanitizers:
    needs: resolve-dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install current stable build tools
        run: python -m pip install --upgrade cmake ninja jinja2 jsonschema
      - uses: actions/download-artifact@v8
        with:
          name: dependency-resolution
          path: out
      - name: Restore the shared backend and codec source revisions
        run: cmake -DANANARCHIVER_DEPENDENCY_RESTORE=ON -P scripts/init-dependencies.cmake
      - run: cmake --preset core-sanitizers
        env:
          CC: gcc-14
          CXX: g++-14
      - run: cmake --build --preset core-sanitizers
      - run: ctest --preset core-sanitizers
      - name: Save sanitizer build provenance and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-info-ubuntu-sanitizers
          path: |
            out/dependency-resolution.json
            out/build/core-sanitizers/build-info.json
            out/build/core-sanitizers/application/build-info.json
            out/build/core-sanitizers/**/dependency-build.json
            out/build/core-sanitizers/**/build-trace-config.json
            out/build/core-sanitizers/**/Testing/Temporary/*.log
            out/build/core-sanitizers/*-prefix/src/*-stamp/*.log
          if-no-files-found: warn
